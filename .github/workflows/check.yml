name: ISR Checker

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Elle test icin degistirme (manual)"
        default: "manual"
        required: false

concurrency:
  group: isr-${{ inputs.source == 'manual' && 'manual' || 'auto' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt

      - name: Sayfayi kontrol et
        run: python checker.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.source == 'manual' }}
